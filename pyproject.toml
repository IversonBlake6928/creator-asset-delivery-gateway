[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-asset-delivery"
version = "0.1.0"
description = "Prepare digital-asset deliveries with subscriber-aware AI copy."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=1.40,<2",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
